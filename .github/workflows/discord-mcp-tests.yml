name: Discord MCP tests

on:
  pull_request:
    paths:
      - "frontend/src/mcp.js"
      - "frontend/test/mcp-discord.test.js"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/discord-mcp-tests.yml"
  push:
    branches:
      - "feature/discord-mcp"
    paths:
      - "frontend/src/mcp.js"
      - "frontend/test/mcp-discord.test.js"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/discord-mcp-tests.yml"

permissions:
  contents: read

jobs:
  discord-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run Discord MCP registry tests
        run: node --test frontend/test/mcp-discord.test.js
