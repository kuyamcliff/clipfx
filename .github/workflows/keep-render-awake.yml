# Pings the Render API every 10 minutes so the free instance doesn't sleep
# (Render sleeps free services after 15 minutes without traffic).
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables
#   → New repository variable: RENDER_URL = https://<your-service>.onrender.com
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::warning::Set the RENDER_URL repository variable to enable keep-alive pings."
            exit 0
          fi
          # A sleeping instance can take ~1 minute to wake, so allow retries.
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 "${RENDER_URL%/}/healthz"
          echo
