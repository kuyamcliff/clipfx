# Render Blueprint for the ClipFX API (backend/).
# Render → New → Blueprint → pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: clipfx-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The database is Cloudflare D1 (through the clipfx-db Worker) and files live in R2, so no disk is needed.
    # Free instances work but sleep when idle; "starter" stays awake.
    plan: free
    # Close to the D1 database (created in western North America).
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE
        value: r2
      # Cloudflare D1 through the clipfx-db Worker (workers/db): its URL and the DB_SECRET it was given.
      - key: D1_URL
        sync: false
      - key: D1_SECRET
        sync: false
      # The website, e.g. https://www.clipfx.me (used for share links and the origin check).
      - key: BASE_URL
        sync: false
      # Developer pages live on <username>.PAGES_DOMAIN.
      - key: PAGES_DOMAIN
        value: clipfx.me
      # Any long random string. Must be identical to the website Worker's INTERNAL_SECRET.
      - key: INTERNAL_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # "Continue with GitHub": OAuth App with callback BASE_URL + /auth/github/callback.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: CONTACT_EMAIL
        sync: false
