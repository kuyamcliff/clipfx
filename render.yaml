# Render Blueprint for the ClipFX API (backend/).
# Render → New → Blueprint → pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: clipfx-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The database is Postgres (DATABASE_URL, e.g. Supabase) and files live in R2, so no disk is needed.
    # Free instances work but sleep when idle; "starter" stays awake.
    plan: free
    # Keep this close to your Vercel functions' region (Vercel's default is iad1, Washington D.C.).
    region: virginia
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE
        value: r2
      # Supabase → Database → Connection string → Session pooler (port 5432).
      - key: DATABASE_URL
        sync: false
      # Your Vercel site, e.g. https://clipfx.vercel.app (used for share links and the origin check).
      - key: BASE_URL
        sync: false
      # Any long random string. Must be identical in Vercel's INTERNAL_SECRET.
      - key: INTERNAL_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: DONATE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
